<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="rf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c79a"/><stop offset="1" stop-color="#d59f6a"/>
    </linearGradient>
    <filter id="rf-grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer></filter>
  </defs>
  <rect width="800" height="800" fill="url(#rf-bg)"/>
  <!-- hazy hills far -->
  <path d="M0 150 Q250 120 500 150 T800 150 L800 260 L0 260 Z" fill="#c69b6a" opacity="0.5"/>
  <!-- a spire -->
  <rect x="360" y="120" width="46" height="150" fill="#c9b48c"/>
  <path d="M360 120 l23 -46 23 46 Z" fill="#9a5233"/>
  <!-- sea of terracotta roofs -->
  <g>
    <g fill="#bb6039">
      <path d="M0 320 l120 -40 120 40 v40 l-120 -30 -120 30 Z"/>
      <path d="M230 340 l110 -34 110 34 v44 l-110 -28 -110 28 Z"/>
      <path d="M450 330 l120 -38 120 38 v42 l-120 -28 -120 28 Z"/>
      <path d="M650 350 l130 -36 130 36 v46 l-130 -26 -130 26 Z"/>
    </g>
    <g fill="#c97a4c">
      <path d="M60 430 l130 -40 130 40 v50 l-130 -30 -130 30 Z"/>
      <path d="M300 450 l120 -38 120 38 v52 l-120 -28 -120 28 Z"/>
      <path d="M520 435 l140 -42 140 42 v50 l-140 -30 -140 30 Z"/>
      <path d="M-40 460 l120 -36 120 36 v52 l-120 -28 -120 28 Z"/>
    </g>
    <g fill="#a84f2e">
      <path d="M20 580 l150 -46 150 46 v70 l-150 -34 -150 34 Z"/>
      <path d="M300 600 l150 -44 150 44 v72 l-150 -32 -150 32 Z"/>
      <path d="M560 585 l160 -46 160 46 v72 l-160 -34 -160 34 Z"/>
    </g>
    <g fill="#c9814f">
      <path d="M-20 720 l170 -50 170 50 v100 l-170 -38 -170 38 Z"/>
      <path d="M300 740 l170 -48 170 48 v90 l-170 -36 -170 36 Z"/>
      <path d="M620 725 l180 -50 180 50 v100 l-180 -38 -180 38 Z"/>
    </g>
  </g>
  <!-- roof tile lines -->
  <g stroke="#8a3f22" stroke-width="1.5" opacity="0.35">
    <path d="M40 560 l130 -36 M100 575 l130 -36 M160 590 l130 -36"/>
    <path d="M340 590 l150 -40 M410 608 l150 -40"/>
  </g>
  <!-- a couple of dormer windows -->
  <g fill="#6b573a"><rect x="150" y="640" width="26" height="30"/><rect x="440" y="660" width="26" height="30"/><rect x="700" y="650" width="26" height="30"/></g>
  <rect width="800" height="800" filter="url(#rf-grain)" opacity="0.5" style="mix-blend-mode:overlay"/>
</svg>
