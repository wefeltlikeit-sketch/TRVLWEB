<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d9ad"/><stop offset="1" stop-color="#e7bd86"/>
    </linearGradient>
    <linearGradient id="cl-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c6a4"/><stop offset="1" stop-color="#b89b70"/>
    </linearGradient>
    <filter id="cl-grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer></filter>
  </defs>
  <rect width="800" height="1000" fill="url(#cl-stone)"/>
  <!-- sky strip at the end of the lane -->
  <path d="M330 0 h140 v420 h-140 Z" fill="url(#cl-sky)"/>
  <!-- receding buildings, left -->
  <path d="M0 0 L330 0 L330 460 L200 560 L0 620 Z" fill="#c3a878"/>
  <path d="M0 120 L200 120 L200 560 L0 620 Z" fill="#b1966a"/>
  <!-- right -->
  <path d="M800 0 L470 0 L470 460 L600 560 L800 620 Z" fill="#cbb082"/>
  <path d="M800 120 L600 120 L600 560 L800 620 Z" fill="#b99e70"/>
  <!-- shuttered windows -->
  <g fill="#5f7a6a">
    <rect x="60" y="180" width="60" height="90"/><rect x="60" y="320" width="60" height="90"/>
    <rect x="680" y="180" width="60" height="90"/><rect x="680" y="320" width="60" height="90"/>
  </g>
  <g fill="#8a9a7a"><rect x="250" y="220" width="44" height="70"/><rect x="506" y="220" width="44" height="70"/></g>
  <!-- climbing plants -->
  <g fill="#5f7a3a" opacity="0.9">
    <path d="M470 60 q40 60 10 160 q-30 -60 -10 -160 Z"/>
    <circle cx="486" cy="120" r="16"/><circle cx="466" cy="170" r="18"/><circle cx="496" cy="200" r="15"/>
  </g>
  <!-- hanging lamp -->
  <g stroke="#4a3a24" stroke-width="6" fill="none"><path d="M470 40 q-40 6 -46 60"/></g>
  <path d="M410 96 l24 0 -6 34 -12 0 Z" fill="#3a2c1a"/>
  <ellipse cx="422" cy="112" rx="8" ry="10" fill="#ffe6a6"/>
  <!-- cobblestone ground -->
  <path d="M0 620 L200 560 L330 460 L470 460 L600 560 L800 620 L800 1000 L0 1000 Z" fill="#a88a5f"/>
  <g fill="#8f724c" opacity="0.7">
    <ellipse cx="400" cy="640" rx="26" ry="9"/><ellipse cx="330" cy="660" rx="30" ry="10"/><ellipse cx="470" cy="662" rx="30" ry="10"/>
    <ellipse cx="260" cy="700" rx="36" ry="12"/><ellipse cx="400" cy="704" rx="38" ry="13"/><ellipse cx="540" cy="700" rx="36" ry="12"/>
    <ellipse cx="180" cy="770" rx="44" ry="15"/><ellipse cx="360" cy="784" rx="46" ry="16"/><ellipse cx="560" cy="774" rx="44" ry="15"/>
    <ellipse cx="120" cy="880" rx="54" ry="18"/><ellipse cx="360" cy="900" rx="58" ry="20"/><ellipse cx="640" cy="880" rx="54" ry="18"/>
  </g>
  <!-- potted plants along the lane -->
  <g>
    <path d="M150 560 l30 0 -4 34 -22 0 Z" fill="#b0543f"/><circle cx="165" cy="546" r="20" fill="#5f7a3a"/>
    <path d="M620 560 l30 0 -4 34 -22 0 Z" fill="#b0543f"/><circle cx="635" cy="546" r="20" fill="#5f7a3a"/>
  </g>
  <rect width="800" height="1000" filter="url(#cl-grain)" opacity="0.5" style="mix-blend-mode:overlay"/>
</svg>
