<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hv-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e4c2"/>
      <stop offset="0.42" stop-color="#f2cf9c"/>
      <stop offset="0.72" stop-color="#e6ab74"/>
      <stop offset="1" stop-color="#d59360"/>
    </linearGradient>
    <radialGradient id="hv-sun" cx="0.7" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#fff6e6" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ffe9c4" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffe9c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hv-h3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdae86"/><stop offset="1" stop-color="#b8965f"/>
    </linearGradient>
    <linearGradient id="hv-h2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b28a55"/><stop offset="1" stop-color="#997343"/>
    </linearGradient>
    <linearGradient id="hv-fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f6b3e"/><stop offset="1" stop-color="#5f4527"/>
    </linearGradient>
    <filter id="hv-soft"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="hv-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#hv-sky)"/>
  <rect width="1200" height="900" fill="url(#hv-sun)"/>
  <circle cx="840" cy="250" r="70" fill="#fff7ea" opacity="0.85"/>

  <!-- distant haze hills -->
  <g filter="url(#hv-soft)" opacity="0.7">
    <path d="M0 470 Q220 420 460 452 T900 440 T1200 452 L1200 900 L0 900 Z" fill="#d9bd93"/>
  </g>
  <path d="M0 520 Q260 470 540 500 T1040 494 T1200 505 L1200 900 L0 900 Z" fill="url(#hv-h3)"/>
  <path d="M0 590 Q300 545 620 578 T1200 572 L1200 900 L0 900 Z" fill="url(#hv-h2)"/>

  <!-- cypress row -->
  <g fill="#6c5a35" opacity="0.9">
    <path d="M120 560 q10 -70 20 0 z"/><path d="M150 566 q9 -60 18 0 z"/>
    <path d="M980 556 q11 -78 22 0 z"/><path d="M1010 562 q9 -64 18 0 z"/>
  </g>

  <!-- hilltop village, terracotta roofs catching light -->
  <g>
    <path d="M470 560 L470 430 Q540 402 640 408 L760 414 L760 560 Z" fill="#c9b48c"/>
    <g fill="#e7d6b4">
      <rect x="486" y="452" width="52" height="108"/>
      <rect x="548" y="440" width="58" height="120"/>
      <rect x="616" y="452" width="50" height="108"/>
      <rect x="676" y="446" width="60" height="114"/>
    </g>
    <g fill="#b9613e">
      <path d="M480 452 l32 -22 32 22 Z"/>
      <path d="M540 440 l35 -24 35 24 Z"/>
      <path d="M610 452 l30 -20 30 20 Z"/>
      <path d="M670 446 l34 -22 34 22 Z"/>
    </g>
    <!-- bell tower -->
    <rect x="626" y="360" width="40" height="200" fill="#ded0ae"/>
    <path d="M624 360 l22 -30 22 30 Z" fill="#a9552f"/>
    <rect x="638" y="392" width="16" height="26" fill="#6b573a"/>
    <!-- warm windows -->
    <g fill="#8a6a3f" opacity="0.8">
      <rect x="500" y="474" width="12" height="18"/><rect x="520" y="474" width="12" height="18"/>
      <rect x="562" y="466" width="13" height="20"/><rect x="584" y="466" width="13" height="20"/>
      <rect x="628" y="476" width="12" height="18"/>
      <rect x="690" y="470" width="13" height="20"/><rect x="712" y="470" width="13" height="20"/>
    </g>
  </g>

  <!-- foreground ridge + winding road -->
  <path d="M0 640 Q320 590 680 632 T1200 628 L1200 900 L0 900 Z" fill="url(#hv-fg)"/>
  <path d="M60 900 Q360 760 520 700 Q660 650 760 640" stroke="#e9d3a6" stroke-width="26" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M60 900 Q360 760 520 700 Q660 650 760 640" stroke="#f3e6c6" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="2 22" opacity="0.6"/>

  <!-- foreground cypress + olive silhouettes -->
  <g fill="#3f3016">
    <path d="M40 900 v-150 q14 -46 28 0 v150 Z"/>
    <path d="M1120 900 v-170 q16 -52 32 0 v170 Z"/>
  </g>

  <!-- film grain -->
  <rect width="1200" height="900" filter="url(#hv-grain)" opacity="0.5" style="mix-blend-mode:overlay"/>
  <!-- soft vignette -->
  <rect width="1200" height="900" fill="url(#hv-sun)" opacity="0"/>
</svg>
