<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="co-sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb2b0"/><stop offset="0.5" stop-color="#4f8f92"/><stop offset="1" stop-color="#356a72"/>
    </linearGradient>
    <linearGradient id="co-land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f9a5c"/><stop offset="1" stop-color="#5f6a3c"/>
    </linearGradient>
    <filter id="co-grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer></filter>
  </defs>
  <rect width="800" height="1000" fill="url(#co-sea)"/>
  <!-- gradient shallows near shore -->
  <path d="M800 0 L800 1000 L360 1000 Q520 600 460 300 Q430 120 520 0 Z" fill="#7ab6b2" opacity="0.55"/>
  <!-- headland -->
  <path d="M800 0 L800 1000 L470 1000 Q600 620 540 320 Q505 130 600 0 Z" fill="url(#co-land)"/>
  <path d="M800 0 L800 1000 L560 1000 Q660 640 620 340 Q595 150 680 0 Z" fill="#727c48" opacity="0.7"/>
  <!-- cliff rim highlight -->
  <path d="M600 0 Q505 130 540 320 Q600 620 470 1000" stroke="#c9b48c" stroke-width="10" fill="none" opacity="0.5"/>
  <!-- pine dots on the headland -->
  <g fill="#3f4a28">
    <circle cx="650" cy="240" r="14"/><circle cx="700" cy="300" r="16"/><circle cx="640" cy="360" r="13"/>
    <circle cx="710" cy="430" r="17"/><circle cx="660" cy="500" r="14"/><circle cx="720" cy="560" r="15"/>
  </g>
  <!-- tiny house with red roof -->
  <g><rect x="636" y="300" width="30" height="24" fill="#e7d6b4"/><path d="M632 300 l19 -14 19 14 Z" fill="#b9613e"/></g>
  <!-- boat + wake in the bay -->
  <g>
    <ellipse cx="230" cy="560" rx="26" ry="10" fill="#f3ece0"/>
    <path d="M230 552 v-22" stroke="#4a3a24" stroke-width="3"/>
    <path d="M120 620 Q200 585 250 560" stroke="#dff0ee" stroke-width="5" fill="none" opacity="0.6" stroke-linecap="round"/>
    <path d="M150 660 Q230 620 275 590" stroke="#dff0ee" stroke-width="4" fill="none" opacity="0.4" stroke-linecap="round"/>
  </g>
  <!-- sea sparkle -->
  <g stroke="#cfeae7" stroke-width="3" stroke-linecap="round" opacity="0.4">
    <path d="M80 300 h50 M180 360 h40 M60 460 h60 M120 820 h50 M60 900 h70"/>
  </g>
  <rect width="800" height="1000" filter="url(#co-grain)" opacity="0.5" style="mix-blend-mode:overlay"/>
</svg>
