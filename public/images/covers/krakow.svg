<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ksky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f6f7a"/>
      <stop offset="0.6" stop-color="#c98a5f"/>
      <stop offset="1" stop-color="#e8c290"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#ksky)"/>
  <circle cx="210" cy="170" r="52" fill="#f2ead0"/>
  <circle cx="192" cy="160" r="48" fill="#5f6f7a" opacity="0.4"/>
  <g fill="#f0e3c4" opacity="0.8">
    <circle cx="420" cy="110" r="2"/><circle cx="560" cy="70" r="2.4"/><circle cx="700" cy="130" r="1.8"/><circle cx="860" cy="90" r="2.2"/><circle cx="1010" cy="140" r="2"/><circle cx="330" cy="220" r="1.8"/>
  </g>
  <!-- basilica with two unequal towers -->
  <g transform="translate(430,180)">
    <rect x="0" y="130" width="340" height="290" fill="#5a3f33"/>
    <path d="M0 130 L170 60 L340 130 Z" fill="#42291f"/>
    <!-- taller left tower -->
    <rect x="-70" y="20" width="80" height="400" fill="#6b4a3a"/>
    <path d="M-70 20 L-30 -70 L10 20 Z" fill="#c9a227"/>
    <path d="M-52 20 v-30 h44 v30 Z" fill="#42291f"/>
    <rect x="-48" y="70" width="16" height="34" fill="#f4d98a"/>
    <rect x="-18" y="70" width="16" height="34" fill="#2b1b13"/>
    <rect x="-48" y="150" width="16" height="34" fill="#2b1b13"/>
    <rect x="-18" y="150" width="16" height="34" fill="#f4d98a"/>
    <!-- shorter right tower -->
    <rect x="330" y="90" width="76" height="330" fill="#6b4a3a"/>
    <path d="M330 90 q38 -60 76 0 Z" fill="#5c6b52"/>
    <rect x="348" y="130" width="16" height="30" fill="#f4d98a"/>
    <rect x="376" y="130" width="16" height="30" fill="#2b1b13"/>
    <!-- rose window -->
    <circle cx="170" cy="210" r="34" fill="#f4d98a" opacity="0.9"/>
    <circle cx="170" cy="210" r="34" fill="none" stroke="#42291f" stroke-width="6"/>
    <path d="M120 420 v-90 a50 50 0 0 1 100 0 v90 Z" fill="#2b1b13"/>
    <path d="M240 420 v-60 a30 30 0 0 1 60 0 v60 Z" fill="#2b1b13"/>
  </g>
  <!-- cloth hall arcade to the left -->
  <g transform="translate(0,470)">
    <rect x="0" y="0" width="380" height="130" fill="#4a3527"/>
    <path d="M0 0 h380 l-14 -34 h-352 Z" fill="#332216"/>
    <g fill="#1d1208">
      <path d="M30 130 v-64 a26 26 0 0 1 52 0 v64 Z"/>
      <path d="M120 130 v-64 a26 26 0 0 1 52 0 v64 Z"/>
      <path d="M210 130 v-64 a26 26 0 0 1 52 0 v64 Z"/>
      <path d="M300 130 v-64 a26 26 0 0 1 52 0 v64 Z"/>
    </g>
  </g>
  <!-- square with string lights and cafe tables -->
  <rect x="0" y="600" width="1200" height="200" fill="#241a12"/>
  <path d="M0 620 Q300 660 600 630 T1200 640" stroke="#f4d98a" stroke-width="3" fill="none" opacity="0.7"/>
  <g fill="#f4d98a">
    <circle cx="120" cy="633" r="5"/><circle cx="260" cy="646" r="5"/><circle cx="400" cy="644" r="5"/><circle cx="540" cy="633" r="5"/><circle cx="680" cy="630" r="5"/><circle cx="820" cy="636" r="5"/><circle cx="960" cy="641" r="5"/><circle cx="1100" cy="640" r="5"/>
  </g>
  <!-- lamppost -->
  <g stroke="#1d1208" stroke-width="8" stroke-linecap="round">
    <path d="M1000 800 v-160"/>
    <path d="M1000 640 q0 -28 -30 -28" fill="none"/>
  </g>
  <circle cx="966" cy="612" r="12" fill="#ffd977"/>
  <circle cx="966" cy="612" r="26" fill="#ffd977" opacity="0.25"/>
  <!-- pigeons -->
  <g fill="#3a3229">
    <ellipse cx="180" cy="756" rx="14" ry="9"/><circle cx="193" cy="748" r="5"/>
    <ellipse cx="240" cy="770" rx="13" ry="8"/><circle cx="252" cy="763" r="5"/>
  </g>
</svg>
