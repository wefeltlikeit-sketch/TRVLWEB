<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="csky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6de"/>
      <stop offset="1" stop-color="#7fcdc0"/>
    </linearGradient>
    <linearGradient id="csea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#159a94"/>
      <stop offset="1" stop-color="#0d5c5a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#csky)"/>
  <circle cx="240" cy="180" r="66" fill="#fdf7e3"/>
  <!-- sea -->
  <path d="M0 520 L1200 470 L1200 800 L0 800 Z" fill="url(#csea)"/>
  <g stroke="#d1fae5" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round">
    <path d="M90 600 h140 M280 640 h110 M160 700 h180 M420 660 h90"/>
  </g>
  <!-- cliff -->
  <path d="M540 800 L560 470 Q580 330 700 280 L1200 180 L1200 800 Z" fill="#7a5a38"/>
  <path d="M600 800 L615 480 Q630 370 730 320 L1200 230 L1200 800 Z" fill="#8d6a42"/>
  <!-- terraced vineyards -->
  <g stroke="#0d5c5a" stroke-width="8" stroke-linecap="round" opacity="0.8">
    <path d="M700 300 L1200 205" fill="none"/>
    <path d="M690 360 L1200 270" fill="none"/>
    <path d="M680 420 L1150 340" fill="none"/>
  </g>
  <!-- stacked houses -->
  <g>
    <g transform="translate(640,420)">
      <rect x="0" y="0" width="70" height="180" fill="#e9b64f"/>
      <rect x="70" y="30" width="66" height="150" fill="#d97757"/>
      <rect x="136" y="10" width="64" height="170" fill="#e5d3ae"/>
      <rect x="200" y="42" width="68" height="138" fill="#c65a4a"/>
      <rect x="268" y="18" width="62" height="162" fill="#e2996b"/>
      <rect x="330" y="46" width="66" height="134" fill="#ead9b0"/>
      <rect x="396" y="22" width="64" height="158" fill="#cf6f50"/>
      <g fill="#2c4a48">
        <rect x="16" y="24" width="20" height="26"/><rect x="16" y="76" width="20" height="26"/><rect x="16" y="128" width="20" height="26"/>
        <rect x="88" y="56" width="20" height="26"/><rect x="88" y="108" width="20" height="26"/>
        <rect x="154" y="36" width="20" height="26"/><rect x="154" y="88" width="20" height="26"/><rect x="154" y="140" width="18" height="24"/>
        <rect x="218" y="66" width="20" height="26"/><rect x="218" y="118" width="20" height="26"/>
        <rect x="286" y="42" width="20" height="26"/><rect x="286" y="94" width="20" height="26"/><rect x="286" y="146" width="18" height="22"/>
        <rect x="348" y="70" width="20" height="26"/><rect x="348" y="122" width="20" height="26"/>
        <rect x="414" y="46" width="20" height="26"/><rect x="414" y="98" width="20" height="26"/>
      </g>
      <!-- bell tower -->
      <rect x="460" y="-40" width="42" height="220" fill="#f0e6cf"/>
      <path d="M460 -40 l21 -30 21 30 Z" fill="#b0543f"/>
      <rect x="472" y="-20" width="18" height="24" fill="#2c4a48"/>
    </g>
  </g>
  <!-- small boat -->
  <g fill="#274b53">
    <path d="M220 560 q40 -14 80 0 l-9 15 h-62 Z"/>
    <path d="M258 560 v-30 l24 16 v14 Z" fill="#e5d3ae"/>
  </g>
</svg>
