<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5e0b8"/>
      <stop offset="0.5" stop-color="#eec98d"/>
      <stop offset="1" stop-color="#d9a05b"/>
    </linearGradient>
    <linearGradient id="driver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0b878"/>
      <stop offset="0.5" stop-color="#c9834f"/>
      <stop offset="1" stop-color="#8b4c36"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#dsky)"/>
  <circle cx="330" cy="240" r="86" fill="#fff4d6"/>
  <circle cx="330" cy="240" r="150" fill="#fff4d6" opacity="0.35"/>
  <!-- far hills -->
  <path d="M0 380 Q200 320 420 372 T860 356 T1200 370 L1200 800 L0 800 Z" fill="#b98046" opacity="0.55"/>
  <!-- cliff with village -->
  <g>
    <path d="M640 800 L640 420 Q660 330 760 320 L1200 300 L1200 800 Z" fill="#8a5a2e"/>
    <path d="M640 470 Q700 440 780 445 L1200 430 L1200 470 Z" fill="#a06a38"/>
    <!-- castle and houses on the cliff edge -->
    <g fill="#4a2f14">
      <path d="M760 320 v-60 h14 v-14 h12 v14 h14 v-14 h12 v14 h14 v60 Z"/>
      <path d="M840 316 v-42 h34 v42 Z M857 252 l17 24 h-34 Z"/>
      <path d="M890 314 v-30 h48 v30 Z"/>
      <path d="M950 312 v-38 h20 v38 Z M960 254 l10 20 h-20 Z"/>
      <path d="M985 312 v-26 h56 v26 Z"/>
      <path d="M1055 310 v-34 h26 v34 Z"/>
    </g>
    <g fill="#3a250f" opacity="0.55">
      <path d="M700 800 v-260 l14 -8 v268 Z M745 800 v-300 l12 -6 v306 Z M1100 800 v-460 l16 -4 v464 Z"/>
    </g>
  </g>
  <!-- river -->
  <path d="M0 560 Q260 500 520 540 Q680 566 640 800 L0 800 Z" fill="url(#driver)"/>
  <path d="M0 600 Q240 552 470 580" stroke="#f2d9a8" stroke-opacity="0.5" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M40 660 Q220 620 400 646" stroke="#f2d9a8" stroke-opacity="0.3" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- canoe -->
  <g fill="#2f1d0a">
    <path d="M250 640 q45 -14 90 0 l-10 14 h-70 Z"/>
    <circle cx="295" cy="622" r="8"/>
    <path d="M300 626 l26 -18 4 6 -26 18 Z"/>
  </g>
  <!-- foreground trees -->
  <g fill="#545a47">
    <path d="M0 800 v-180 q30 -40 55 0 q28 -52 58 0 q24 -36 48 0 v180 Z" opacity="0.9"/>
  </g>
</svg>
