<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="alp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b5560"/>
      <stop offset="0.5" stop-color="#c9836f"/>
      <stop offset="1" stop-color="#f2c9a0"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b49a"/>
      <stop offset="1" stop-color="#8c5f54"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#alp)"/>
  <circle cx="600" cy="330" r="54" fill="#ffe8d1" opacity="0.95"/>
  <g fill="#f6d9c2" opacity="0.6">
    <circle cx="180" cy="140" r="2.4"/><circle cx="340" cy="90" r="1.8"/><circle cx="520" cy="150" r="2"/><circle cx="760" cy="80" r="2.2"/><circle cx="940" cy="150" r="1.8"/><circle cx="1080" cy="90" r="2.4"/>
  </g>
  <!-- jagged towers -->
  <g fill="url(#rock)">
    <path d="M60 800 L150 340 L200 460 L250 300 L310 480 L360 360 L430 800 Z"/>
    <path d="M380 800 L500 260 L545 420 L600 220 L660 430 L710 320 L790 800 Z"/>
    <path d="M740 800 L860 340 L910 470 L970 290 L1030 470 L1090 380 L1160 800 Z"/>
  </g>
  <g fill="#5d4038" opacity="0.5">
    <path d="M250 300 L310 480 L360 360 L430 800 L320 800 Z"/>
    <path d="M600 220 L660 430 L710 320 L790 800 L660 800 Z"/>
    <path d="M970 290 L1030 470 L1090 380 L1160 800 L1040 800 Z"/>
  </g>
  <!-- meadow -->
  <path d="M0 800 L0 660 Q300 600 620 650 T1200 660 L1200 800 Z" fill="#4a5a3c"/>
  <path d="M0 800 L0 730 Q380 670 760 715 T1200 730 L1200 800 Z" fill="#33402a"/>
  <!-- drone silhouette -->
  <g transform="translate(830,190)" fill="#302e2a">
    <rect x="-26" y="-6" width="52" height="14" rx="6"/>
    <path d="M-26 0 l-30 -14 M26 0 l30 -14" stroke="#302e2a" stroke-width="5"/>
    <path d="M-70 -16 h28 M42 -16 h28" stroke="#302e2a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="10" r="5" fill="#e8b46a"/>
  </g>
  <!-- hiker with camera -->
  <g transform="translate(230,690)" fill="#302e2a">
    <circle cx="0" cy="-56" r="9"/>
    <path d="M0 -47 v30 l-10 26 M0 -17 l11 25 M0 -40 l-16 12 M0 -40 l18 8"/>
    <path d="M0 -47 v30 l-10 26 M0 -17 l11 25 M0 -40 l-16 12 M0 -40 l18 8" stroke="#302e2a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M18 -34 l14 -3 v10 l-14 2 Z"/>
  </g>
</svg>
