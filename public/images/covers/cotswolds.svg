    <g transform="translate(320,720)"><ellipse cx="0" cy="0" rx="24" ry="15" fill="#f5f1e6"/><circle cx="22" cy="-7" r="8" fill="#42423c"/><path d="M-12 13 v13 M9 13 v13" stroke="#42423c" stroke-width="4"/></g>
    <g transform="translate(700,730)"><ellipse cx="0" cy="0" rx="26" ry="16" fill="#f5f1e6"/><circle cx="-24" cy="-8" r="9" fill="#42423c"/><path d="M-12 14 v14 M12 14 v14" stroke="#42423c" stroke-width="4"/></g>
