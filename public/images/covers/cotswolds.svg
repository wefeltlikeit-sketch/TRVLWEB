    <rect x="62" y="86" width="28" height="44" fill="#544230"/>
    <rect x="112" y="-6" width="16" height="34" fill="#8a7354"/>
    <rect x="160" y="58" width="120" height="72" fill="#d3bd93"/>
    <path d="M152 58 L220 12 L288 58 Z" fill="#7d6749"/>
    <rect x="182" y="82" width="24" height="26" fill="#3f4a3c"/>
    <rect x="236" y="82" width="24" height="26" fill="#3f4a3c"/>
  </g>
  <!-- church tower in distance -->
  <g transform="translate(880,380)" fill="#c9b489">
    <rect x="0" y="0" width="44" height="96"/>
    <path d="M-4 0 h52 l-6 -14 h-40 Z" fill="#9b855f"/>
    <rect x="14" y="20" width="16" height="24" fill="#3f4a3c"/>
