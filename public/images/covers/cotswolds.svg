    <ellipse cx="310" cy="130" rx="60" ry="20"/>
    <ellipse cx="640" cy="110" rx="80" ry="22"/>
  </g>
  <!-- rolling hills -->
  <path d="M0 430 Q300 330 620 420 T1200 400 L1200 800 L0 800 Z" fill="#7fae72"/>
  <path d="M0 560 Q350 460 720 545 T1200 530 L1200 800 L0 800 Z" fill="#5f9457"/>
  <path d="M0 700 Q400 610 820 680 T1200 670 L1200 800 L0 800 Z" fill="#477a41"/>
